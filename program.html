<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NimVar 2026 | Program</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header-small">
        <div class="header-bg-image"></div>
        <div class="container header-content">
            <h1>Scientific Program</h1>
        </div>
    </header>

    <nav>
        <div class="container">
            <div class="nav-brand-mobile">NimVar 2026</div>
            
            <button type="button" class="hamburger" id="hamburger-menu" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="nav-links" id="nav-links">
                <a href="index.html" >Home</a>
                <a href="program.html" class="active">Program</a>
                <a href="registration.html">Registration</a>
                <a href="venue.html">Venue</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div style="text-align: center; margin: 80px 0;">
            <p>The workshop will begin on the morning of September 14th and conclude around lunchtime on September 17th.<br>
A detailed scientific program will be published on this page in August.</p>
        </div>
    </main>

    <footer>
        <div class="container footer-content">
            <div class="footer-left">
                <p class="sponsor-label" style="visibility: hidden;">University</p>
                <a href="https://matematica.unipv.it/en/homepage/" target="_blank" rel="noopener noreferrer">
                    <img src="images/logo_unipv_dimat.png" alt="University Logo" class="footer-logo">
                </a>
            </div>
            <div class="footer-center">
                <p class="sponsor-label" style="visibility: hidden;">Placeholder</p>
                <a href="https://konstantinos-bessas.github.io/NimVar/index.html" target="_blank" rel="noopener noreferrer">
                    <img src="images/NimVar_Logo.png" alt="NimVar 2026 Logo" class="footer-logo">

            </div>
            <div class="footer-right">
                <p class="sponsor-label">Funded by</p>
                <a href="https://www.fondazionecariplo.it/en/" target="_blank" rel="noopener noreferrer">
                    <img src="images/logo_cariplo.svg" alt="Sponsor Logo" class="footer-logo">
                </a>
            </div>
        </div>
    </footer>
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const hamburger = document.getElementById("hamburger-menu");
        const navLinks = document.getElementById("nav-links");

        hamburger.addEventListener("click", function(event) {
            event.preventDefault(); 
            event.stopPropagation(); 

            navLinks.classList.toggle("active");
            hamburger.classList.toggle("active");
        });

        document.addEventListener("click", function(event) {
            const isClickInside = navLinks.contains(event.target) || hamburger.contains(event.target);
            if (!isClickInside && navLinks.classList.contains("active")) {
                navLinks.classList.remove("active");
                hamburger.classList.remove("active");
            }
        });
    });
    </script>
</body>
</html>
